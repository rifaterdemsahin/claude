<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Renderer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- PrismJS for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --secondary-bg: #1e293b;
            --border-color: #334155;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--accent-color);
            text-decoration: none;
        }
        .container {
            flex: 1;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            background-color: var(--secondary-bg);
            border-radius: 8px;
            margin-top: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .back-btn {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        .back-btn:hover {
            background-color: var(--border-color);
        }
        /* Markdown Styles */
        #content {
            line-height: 1.6;
        }
        #content h1, #content h2, #content h3 {
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-top: 2rem;
        }
        #content a {
            color: var(--accent-color);
        }
        #content pre {
            background-color: #1e1e1e !important;
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
        }
        #content code {
            font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">✨ Back to Home</a>
        <a href="index.html" class="back-btn">Go Back</a>
    </header>

    <div class="container">
        <div id="content">Loading markdown...</div>
    </div>

    <!-- PrismJS Core and Autoloader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <!-- MermaidJS -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    
    <script>
        mermaid.initialize({ startOnLoad: true, theme: 'dark' });

        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file');

        if(file) {
            fetch(file)
                .then(response => {
                    if(!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(text => {
                    document.getElementById('content').innerHTML = marked.parse(text);
                    Prism.highlightAll();
                    
                    // Render mermaid diagrams dynamically
                    const mermaidBlocks = document.querySelectorAll('code.language-mermaid');
                    mermaidBlocks.forEach((block, index) => {
                        const pre = block.parentElement;
                        const div = document.createElement('div');
                        div.className = 'mermaid';
                        div.textContent = block.textContent;
                        pre.replaceWith(div);
                    });
                    mermaid.init();
                })
                .catch(err => {
                    document.getElementById('content').innerHTML = `<h2>Error: ${err.message}</h2><p>Could not load ${file}</p>`;
                });
        } else {
            document.getElementById('content').innerHTML = `<h2>No file specified</h2>`;
        }
    </script>
</body>
</html>
